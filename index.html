<head>

  <title>FINSIGHT | Decision Workspace</title>
  <!--This imports google fonts-->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <!--This connects to the fonts google servers and cross origin
    allows and tells the browser to preconnect using CORS credentials
    CORS (Cross-Origin Resource Sharing)-->
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <!--Telling google the fonts to package and its weight and display=swap tells 
     the browser if the internet is slow, switch to default system font, once google 
     font finishes downloading, swap it in-->
  <link
    href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap"
    rel="stylesheet">
</head>
